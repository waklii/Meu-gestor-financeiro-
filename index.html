<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Gestor Financeiro</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #212121;
            --surface-color: #303030;
            --surface-light: #424242;
            --primary: #00bcd4; /* Azul ciano da imagem */
            --success: #4caf50;
            --danger: #f44336;
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --border-color: #424242;
        }

        body { 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            padding-bottom: 80px; /* Espaço para a barra inferior */
        }

        .tela { display: none; } 
        .tela.ativa { display: block; } 
        
        .container { max-width: 600px; margin: 0 auto; }

        /* --- TELA DE LOGIN --- */
        .login-box { padding: 40px 20px; text-align: center; }
        .login-box input { 
            width: 100%; padding: 15px; margin: 10px 0; 
            background: var(--surface-color); border: 1px solid var(--border-color); 
            color: white; border-radius: 8px; box-sizing: border-box;
        }
        .login-box button { 
            width: 100%; padding: 15px; background: var(--primary); 
            color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 10px;
        }

        /* --- HEADER E RESUMO --- */
        .header {
            background-color: var(--surface-color);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        .month-selector {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: var(--primary); font-weight: 500;
        }
        .month-selector i { color: var(--text-main); font-size: 20px; }
        
        .resumo-principal { margin: 15px 0; }
        .resumo-principal h4 { margin: 0; color: var(--text-muted); font-weight: 400; }
        .resumo-principal h1 { margin: 5px 0; font-size: 32px; font-weight: bold; }

        .sub-resumo { display: flex; justify-content: space-around; font-size: 14px; margin-top: 15px; }
        .sub-resumo div { display: flex; flex-direction: column; align-items: center; }
        .sub-resumo i { margin-bottom: 5px; }

        /* --- ABAS --- */
        .tabs {
            display: flex; justify-content: space-around; background: var(--surface-color); border-bottom: 1px solid var(--border-color);
        }
        .tab {
            padding: 15px; color: var(--text-muted); font-weight: 500; cursor: pointer; flex: 1; text-align: center;
        }
        .tab.ativa { color: var(--primary); border-bottom: 3px solid var(--primary); }

        /* --- LISTA DE TRANSAÇÕES --- */
        ul { list-style: none; padding: 0; margin: 0; }
        li { 
            display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); background-color: var(--bg-color);
        }
        .item-icon {
            width: 40px; height: 40px; border-radius: 50%; background: var(--surface-light); 
            display: flex; justify-content: center; align-items: center; margin-right: 15px;
        }
        .item-icon.pendente i { color: var(--danger); }
        .item-icon.concluido i { color: var(--success); }
        
        .item-info { flex: 1; }
        .item-info strong { display: block; font-size: 16px; margin-bottom: 4px; }
        .item-info small { color: var(--text-muted); font-size: 13px; }
        
        .item-valor { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .valor-receita { color: var(--success); }
        .valor-despesa { color: var(--danger); }
        .item-valor i { color: var(--text-muted); font-size: 12px; }

        /* --- BARRA INFERIOR E FAB (Botão +) --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background-color: var(--surface-color); display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--border-color); z-index: 100;
        }
        .bottom-nav i { font-size: 24px; color: var(--text-muted); cursor: pointer; }
        .bottom-nav i:hover { color: var(--primary); }

        .fab {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 65px; height: 65px; background-color: var(--primary); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 101; cursor: pointer;
            border: 6px solid var(--bg-color); /* Cria o efeito de recorte sobre a barra */
        }
        .fab i { font-size: 28px; color: var(--bg-color); }

        /* --- MODAL (TELA SOBREPOSTA) PARA NOVO LANÇAMENTO --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--surface-color); width: 90%; max-width: 400px; padding: 25px; border-radius: 15px;
        }
        .modal-content h3 { margin-top: 0; text-align: center; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%; padding: 12px; margin: 8px 0 15px; background: var(--bg-color); border: 1px solid var(--border-color); color: white; border-radius: 8px; box-sizing: border-box;
        }
        .modal-content button {
            width: 100%; padding: 15px; background: var(--primary); color: var(--bg-color); border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .btn-fechar-modal { background: transparent !important; color: var(--danger) !important; border: 1px solid var(--danger) !important; margin-top: 10px; }

        /* Utilitários */
        .escondido { display: none !important; }
    </style>
</head>
<body>

    <div id="telaLogin" class="tela ativa container">
        <div class="login-box">
            <h2>Bem-vindo de volta</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Faça login para gerenciar suas finanças.</p>
            <input type="email" id="email" placeholder="Seu E-mail">
            <input type="password" id="senha" placeholder="Sua Senha">
            <button onclick="fazerLogin()">Entrar / Cadastrar</button>
            <p id="msgErro" style="color: var(--danger); display: none;"></p>
        </div>
    </div>

    <div id="telaInicio" class="tela container">
        
        <div class="header">
            <div class="month-selector">
                <i class="fas fa-chevron-left"></i>
                <span id="mesAtual">Junho/2026</span>
                <i class="fas fa-chevron-right"></i>
                <i class="far fa-calendar-alt"></i>
            </div>

            <div class="resumo-principal">
                <h4>Saldo Atual</h4>
                <h1 id="saldoAtual">R$ 0,00</h1>
            </div>

            <div class="sub-resumo">
                <div>
                    <i class="fas fa-check-circle" style="color: var(--success);"></i>
                    <span style="color: var(--text-muted);">Receitas</span>
                    <strong id="totalRec" style="color: white;">R$ 0,00</strong>
                </div>
                <div>
                    <i class="fas fa-exclamation-circle" style="color: var(--danger);"></i>
                    <span style="color: var(--text-muted);">Despesas</span>
                    <strong id="totalDes" style="color: white;">R$ 0,00</strong>
                </div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab ativa">Todos</div>
            <div class="tab">Receitas</div>
            <div class="tab">Despesas</div>
        </div>

        <ul id="listaTransacoes"></ul>

        <div class="bottom-nav">
            <i class="far fa-user" onclick="sair()" title="Sair da Conta"></i>
            <div style="width: 50px;"></div> <i class="fas fa-bars" onclick="abrirConfiguracoes()" title="Menu"></i>
        </div>

        <div class="fab" onclick="abrirModal()">
            <i class="fas fa-plus"></i>
        </div>
    </div>

    <div id="modalLancamento" class="modal">
        <div class="modal-content">
            <h3>Novo Lançamento</h3>
            <input type="text" id="desc" placeholder="Descrição (ex: Conta de Luz)">
            <input type="number" id="valor" placeholder="Valor (R$)">
            <input type="date" id="data">
            <select id="tipo">
                <option value="despesa">Despesa (Saída)</option>
                <option value="receita">Receita (Entrada)</option>
            </select>
            <button onclick="adicionarTransacao()">Salvar</button>
            <button class="btn-fechar-modal" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <div id="modalMenu" class="modal">
        <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
            <h3 style="color: var(--primary);"><i class="fas fa-robot"></i> Inteligência Artificial</h3>
            <textarea id="textoIA" placeholder="Escreva o que gastou e eu organizo... (Em breve!)"></textarea>
            
            <h3 style="margin-top: 20px;"><i class="fas fa-sticky-note"></i> Bloco de Notas</h3>
            <textarea id="textoNota" placeholder="Suas anotações..."></textarea>
            <button onclick="salvarNota()">Salvar Anotação</button>
            <p id="msgNota" style="color: var(--success); font-size: 14px; display: none; text-align: center;">Salvo!</p>

            <button class="btn-fechar-modal" onclick="fecharModalMenu()">Voltar</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DO SEU FIREBASE MANTIDAS
        const firebaseConfig = {
            apiKey: "AIzaSyDpauFc8LOixpeUJcU1KkF_yyI-vDJKlCE",
            authDomain: "meu-gestor-financeiroo.firebaseapp.com",
            projectId: "meu-gestor-financeiroo",
            storageBucket: "meu-gestor-financeiroo.firebasestorage.app",
            messagingSenderId: "881613777073",
            appId: "1:881613777073:web:3f771faa53f0ff16be9a90",
            measurementId: "G-4DXBW6SPP5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        if ("Notification" in window) { Notification.requestPermission(); }

        // Definir Mês Atual no Header Visualmente
        const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        const hoje = new Date();
        document.getElementById('mesAtual').innerText = `${meses[hoje.getMonth()]}/${hoje.getFullYear()}`;

        // Navegação principal
        function ir(id) {
            document.querySelectorAll('.tela').forEach(tela => tela.classList.remove('ativa'));
            document.getElementById(id).classList.add('ativa');
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                ir('telaInicio');
                carregarTransacoes(user.uid);
                carregarNota(user.uid);
            } else {
                ir('telaLogin');
            }
        });

        function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msgErro = document.getElementById('msgErro');

            auth.signInWithEmailAndPassword(email, senha).catch(error => {
                if (error.code === 'auth/user-not-found') {
                    auth.createUserWithEmailAndPassword(email, senha).catch(err => {
                        msgErro.innerText = err.message; msgErro.style.display = 'block';
                    });
                } else {
                    msgErro.innerText = "Erro: " + error.message; msgErro.style.display = 'block';
                }
            });
        }

        function sair() { auth.signOut(); }

        // Modais (Abertura e Fechamento)
        function abrirModal() { document.getElementById('modalLancamento').style.display = 'flex'; }
        function fecharModal() { document.getElementById('modalLancamento').style.display = 'none'; }
        function abrirConfiguracoes() { document.getElementById('modalMenu').style.display = 'flex'; }
        function fecharModalMenu() { document.getElementById('modalMenu').style.display = 'none'; }

        // Salvar Anotação (Bloco de Notas)
        function salvarNota() {
            const user = auth.currentUser;
            if (!user) return;
            const texto = document.getElementById('textoNota').value;
            db.collection('notas').doc(user.uid).set({ texto: texto }).then(() => {
                const msg = document.getElementById('msgNota');
                msg.style.display = 'block'; setTimeout(() => msg.style.display = 'none', 3000);
            });
        }
        function carregarNota(uid) {
            db.collection('notas').doc(uid).get().then(doc => {
                if (doc.exists) { document.getElementById('textoNota').value = doc.data().texto; }
            });
        }

        // Salvar Transação
        function adicionarTransacao() {
            const user = auth.currentUser;
            if (!user) return;

            const desc = document.getElementById('desc').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const data = document.getElementById('data').value;
            const tipo = document.getElementById('tipo').value;

            if (!desc || !valor || !data) { alert("Preencha todos os campos!"); return; }

            db.collection('financas').add({
                userId: user.uid, desc: desc, valor: valor, data: data, tipo: tipo
            }).then(() => {
                document.getElementById('desc').value = '';
                document.getElementById('valor').value = '';
                document.getElementById('data').value = '';
                fecharModal();
            });
        }

        // Carregar e Exibir Transações (Igual ao Design da Imagem)
        let notificacoesEnviadas = [];

        function carregarTransacoes(uid) {
            db.collection('financas').where('userId', '==', uid).orderBy('data', 'desc').onSnapshot(snapshot => {
                const lista = document.getElementById('listaTransacoes');
                lista.innerHTML = '';
                
                let totalReceitas = 0; let totalDespesas = 0;
                const dataHojeIso = new Date().toISOString().split('T')[0];

                snapshot.forEach(doc => {
                    const item = doc.data();
                    if (item.tipo === 'receita') totalReceitas += item.valor;
                    if (item.tipo === 'despesa') totalDespesas += item.valor;

                    // Notificações
                    if (item.tipo === 'despesa' && item.data === dataHojeIso && !notificacoesEnviadas.includes(doc.id)) {
                        if (Notification.permission === "granted") {
                            new Notification("Despesa Hoje!", { body: `Vencimento de '${item.desc}' no valor de R$ ${item.valor.toFixed(2)}` });
                        }
                        notificacoesEnviadas.push(doc.id);
                    }

                    // Formatar para o Layout da Imagem
                    const dataPartes = item.data.split('-');
                    const dataFormatada = `${dataPartes[2]}/${dataPartes[1]}/${dataPartes[0]}`;
                    
                    const li = document.createElement('li');
                    
                    // Condicionais de Estilo baseado na imagem
                    const isReceita = item.tipo === 'receita';
                    const iconClass = isReceita ? 'concluido' : 'pendente';
                    const iconLogo = isReceita ? 'fa-check' : 'fa-exclamation';
                    const corValor = isReceita ? 'valor-receita' : 'valor-despesa';
                    const sinalValor = isReceita ? '+ R$' : '- R$';

                    li.innerHTML = `
                        <div class="item-icon ${iconClass}"><i class="fas ${iconLogo}"></i></div>
                        <div class="item-info">
                            <strong>${item.desc}</strong>
                            <small>${dataFormatada}</small>
                        </div>
                        <div class="item-valor ${corValor}">
                            ${sinalValor} ${item.valor.toFixed(2)}
                            <i class="fas fa-sync-alt" style="margin-left: 5px;"></i>
                        </div>
                    `;
                    lista.appendChild(li);
                });

                // Atualizar Resumo
                document.getElementById('totalRec').innerText = `R$ ${totalReceitas.toFixed(2)}`;
                document.getElementById('totalDes').innerText = `R$ ${totalDespesas.toFixed(2)}`;
                const saldo = totalReceitas - totalDespesas;
                document.getElementById('saldoAtual').innerText = `R$ ${saldo.toFixed(2)}`;
            });
        }
    </script>
</body>
    </html>
